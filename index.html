<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App - Tugas Rutin 5</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0;1&display=swap" rel="stylesheet" />

    <style>
        /* Fallback font application incase tailwind config doesn't set it */
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<!-- Menggantikan body CSS dari pool.css ke Tailwind, bg-image bisa disesuaikan dengan file di public/assets vite kamu -->
<body class="relative flex items-center justify-center w-full min-h-[100dvh] bg-cover bg-center overflow-hidden text-white bg-slate-900" style="background-image: url('/image.png');">
    
    <!-- Overlay efek blur & gelap (body::before di pool.css) -->
    <div class="absolute inset-0 bg-black/15 backdrop-blur-[10px] z-0"></div>

    <!-- Main Container dgn efek glassmorphism -->
    <main class="relative z-10 w-full max-w-[475px] h-auto min-h-[450px] p-[25px] mx-4 rounded-[10px] bg-gradient-to-t from-black/15 to-white/15 backdrop-blur-[100px] shadow-2xl flex flex-col">
        
        <!-- Input Container -->
        <header class="relative mb-[13px] w-full">
            <input id="city-input" class="w-full py-[10px] pl-4 pr-[45px] rounded-full border-[3px] border-transparent bg-black/15 focus:border-black/15 outline-none text-white placeholder:text-white/70 font-[450] transition-all duration-300" placeholder="Cari kota..." type="text" autocomplete="off">
            <button id="search-btn" class="absolute right-[10px] top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer flex items-center justify-center text-white hover:scale-110 transition-transform">
                <span class="material-symbols-outlined">search</span>
            </button>
        </header>

        <!-- Tempat State Loading -->
        <div id="loading-state" class="hidden flex-col items-center justify-center flex-1 py-8">
            <span class="material-symbols-outlined animate-spin text-5xl">progress_activity</span>
            <p class="mt-2 text-sm font-medium text-white/80">Mencari data cuaca...</p>
        </div>

        <!-- Tempat State Error -->
        <div id="error-state" class="hidden flex-col items-center justify-center flex-1 py-8 text-center">
            <span class="material-symbols-outlined text-5xl text-red-400">error</span>
            <p id="error-msg" class="mt-2 font-medium text-red-200">Kota tidak ditemukan (404)</p>
        </div>

        <!-- Weather Info Section -->
        <section id="weather-info" class="flex flex-col gap-[12px] flex-1">
            <!-- Lokasi & Tanggal -->
            <div class="flex justify-between items-center mt-2">
                <div class="flex items-center gap-[5px]">
                    <span class="material-symbols-outlined flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q152 0 263.5 98T876-538q-20-10-41.5-15.5T790-560q-19-73-68.5-130T600-776v16q0 33-23.5 56.5T520-680h-80v80q0 17-11.5 28.5T400-560h-80v80h240q11 0 20.5 5.5T595-459q-17 27-26 57t-9 62q0 63 32.5 117T659-122q-41 20-86 31t-93 11Zm-40-82v-78q-33 0-56.5-23.5T360-320v-40L168-552q-3 18-5.5 36t-2.5 36q0 121 79.5 212T440-162Zm340 82q-7 0-12-4t-7-10q-11-35-31-65t-43-59q-21-26-34-57t-13-65q0-58 41-99t99-41q58 0 99 41t41 99q0 34-13.5 64.5T873-218q-23 29-43 59t-31 65q-2 6-7 10t-12 4Zm0-113q10-17 22-31.5t23-29.5q14-19 24.5-40.5T860-340q0-33-23.5-56.5T780-420q-33 0-56.5 23.5T700-340q0 24 10.5 45.5T735-254q12 15 23.5 29.5T780-193Zm0-97q-21 0-35.5-14.5T730-340q0-21 14.5-35.5T780-390q21 0 35.5 14.5T830-340q0 21-14.5 35.5T780-290Z"/></svg>
                    </span>
                    <h4 id="city-name" class="text-xl font-bold">Medan</h4>
                </div>
                <h5 id="current-date" class="font-[500] text-sm text-white/90">Wed, 18 Jun</h5>
            </div>      
            
            <!-- Icon Cuaca & Suhu -->
            <div class="flex justify-between items-center mt-2">
                <!-- Fallback icon from OpenWeatherMap format or local assets -->
                <img id="weather-icon" src="https://openweathermap.org/img/wn/04d@4x.png" alt="Ikon Cuaca" class="w-[120px] h-[120px] object-contain drop-shadow-lg">
                <div class="text-right flex flex-col items-end">
                    <div class="flex items-start">
                        <h1 id="temp-value" class="text-[54px] font-bold leading-none tracking-tighter">31</h1>
                        <!-- Bonus: Toggle C/F sesuai Requirement -->
                        <button id="unit-toggle" class="text-2xl font-bold hover:text-white/70 transition-colors cursor-pointer" title="Ubah Satuan">°C</button>
                    </div>
                    <h3 id="condition-txt" class="font-[500] text-xl capitalize text-white/90 mt-1">Clouds</h3>
                </div>
            </div>

            <!-- Kartu Kondisi Tambahan (Kelembaban & Angin) -->
            <div class="flex justify-between items-center mt-auto mb-2 pt-4 border-t border-white/20">
                
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center p-2 rounded-full bg-black/20">
                        <span class="material-symbols-outlined text-blue-200">cool_to_dry</span> 
                    </div>
                    <div>
                        <h4 class="font-[500] text-xs text-white/70">Kelembaban</h4>
                        <h4 id="humidity-value" class="font-bold text-lg">45%</h4>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center p-2 rounded-full bg-black/20">
                        <span class="material-symbols-outlined text-gray-200">air</span>
                    </div>
                    <div>
                        <h4 class="font-[500] text-xs text-white/70">Kecepatan Angin</h4>
                        <h4 id="wind-value" class="font-bold text-lg">3 m/s</h4>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Entry point JS untuk Vite -->
    <script type="module" src="/main.js"></script>
</body>
</html>
